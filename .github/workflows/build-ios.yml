name: Build CueDeck iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package iOS IPA
    runs-on: macos-15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          XCODE_PATH=$(find /Applications -maxdepth 1 -name "Xcode_16*.app" | sort -V | tail -n 1)
          if [ -n "$XCODE_PATH" ]; then
            echo "Selecting $XCODE_PATH"
            sudo xcode-select -s "$XCODE_PATH"
          fi
          xcodebuild -version

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Kotlin Multiplatform iOS Framework
        run: |
          set -o pipefail
          ./gradlew :shared:linkReleaseFrameworkIosArm64 --no-daemon --stacktrace 2>&1 | tee build_log_ios.txt

      - name: Push Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b build-failure-log-ios || git checkout build-failure-log-ios
          git add build_log_ios.txt || true
          git commit -m "ios build failure log" || true
          git push -f origin build-failure-log-ios || true

      - name: Generate Xcode Project
        run: |
          cd iosApp
          xcodegen generate

      - name: Build iOS App
        run: |
          set -o pipefail
          cd iosApp
          xcodebuild -project iosApp.xcodeproj -scheme iosApp -destination "generic/platform=iOS" -configuration Release build -derivedDataPath ../build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tee ../xcodebuild_log.txt

      - name: Push Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b build-failure-log-ios || git checkout build-failure-log-ios
          touch xcodebuild_log.txt build_log_ios.txt
          git add xcodebuild_log.txt build_log_ios.txt || true
          git commit -m "ios build failure log" || true
          git push -f origin build-failure-log-ios || true

      - name: Package Payload into IPA
        run: |
          mkdir -p release_assets/Payload
          cp -r build/DerivedData/Build/Products/Release-iphoneos/*.app release_assets/Payload/
          cd release_assets && zip -r CueDeck-v1.1.4.ipa Payload

      - name: Upload IPA as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueDeck-ios-ipa
          path: release_assets/CueDeck-v1.1.4.ipa
          retention-days: 14

      - name: Upload IPA to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.4
          files: release_assets/CueDeck-v1.1.4.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
