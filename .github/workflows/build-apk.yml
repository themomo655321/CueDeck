name: Build CueDeck Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release_assets/CueDeck-v1.1.1-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueDeck-debug-apk
          path: release_assets/CueDeck-v1.1.1-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.1
          name: "CueDeck v1.1.1 Preview APK"
          make_latest: true
          body: |
            ### 🎛️ CueDeck v1.1.1 - Live Cue Trigger & Show Control
            Direct Android APK build for mobile & tablet testing (compatible with Android 11+ and ADVAN Sketsa 2).

            #### 🛠️ What's New in v1.1.1:
            - **Landscape Mode Layout Overhaul**:
              - **Full-Height 4-Channel Mixer on Left Side**: The 4-channel Live Mixer now fills the entire left column vertically from top to bottom, turning the tablet/landscape screen into a true full-scale mixing console with tall, physical-feeling fader grooves.
              - **Now Playing at Top of Cue Stack**: Moved the Now Playing active track drawer to the top of the cue stack on the right pane (just below the Armed / Standby card), perfectly mirroring portrait mode.
              - **Dynamic Vertical Space Allocation**: Now Playing only occupies height when tracks are actively playing (with scrollable multi-track support up to 160dp max), collapsing completely when idle to give the Cue Stack maximum vertical space.
              - **Dynamic Fader Virtual Travel**: Virtual drag tracking canvas scales dynamically with the physical fader height (at least 1:1 or 4× in FINE mode) so full-height faders glide smoothly without twitching or hypersensitivity.
            - **Retained from v1.1.0 & v1.0.9**:
              - Virtual Infinite Canvas + Floating Value HUD (% and dB).
              - Double-tap fader to snap to unity gain (100% / 0.0 dB).
              - Per-channel Reverb / Echo Fade-out Tail (`[✦ TAIL]`) with 1.8s smooth acoustic decay.
              - Hardware volume rocker cue stack selection with circular wrap-around.
              - Tap Armed / Standby card to jump into Cue Edit.
          files: release_assets/CueDeck-v1.1.1-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
