name: Build CueDeck Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt

      - name: Push Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b build-failure-log || git checkout build-failure-log
          git add build_log.txt
          git commit -m "build failure log"
          git push -f origin build-failure-log

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release_assets/CueDeck-v1.1.2-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueDeck-debug-apk
          path: release_assets/CueDeck-v1.1.2-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.2
          name: "CueDeck v1.1.2 Preview APK"
          make_latest: true
          body: |
            ### 🎛️ CueDeck v1.1.2 - Live Cue Trigger & Show Control
            Direct Android APK build for mobile & tablet testing (compatible with Android 11+ and ADVAN Sketsa 2).

            #### 🛠️ What's New in v1.1.2:
            - **Option A: Elastic Throttle Chasing Faders (FINE Mode)**:
              - When `FINE` mode is active, touching or holding anywhere on the fader track sets the target volume, and the fader smoothly glides towards your held finger at the gear-ratio speed.
              - **Elastic Speed**: Micro-crawls at ~5%/sec (0.05 dB increments) when your finger is close, and accelerates up to ~28%/sec when held far ahead.
              - Neon cyan target indicator dot shows where the fader is pursuing. Releasing locks volume immediately.
              - Double-tap instantly snaps to unity gain (100% / 0.0 dB).
            - **Resizable Workspace with Tactile Splitters**:
              - **Horizontal Splitter**: Draggable 3-dot grip bar between columns to smoothly allocate screen width (20% to 80%).
              - **Vertical Splitter**: Draggable bar to resize mixer fader height on the fly (120dp to 350dp).
              - All panels and faders flex dynamically to fit the allocated area.
            - **Stage Workspace Layout Manager (`[ ⊞ ]` in Top Bar)**:
              - Select factory presets and save/load custom layouts.
              - **Protected Default Layouts**: Factory defaults are marked `🔒 READ-ONLY` and cannot be overwritten or deleted!
              - **Full Dual-Orientation Profiles**: Landscape and Portrait orientations independently remember their own layout and split ratios.
              - **Factory Presets Included**:
                - Landscape: *Studio Console* (Default), *Cue Master* (Reversed), *Broadcast Deck* (Mixer Bottom).
                - Portrait: *Classic Theatre* (Default), *Split Screen Mobile*.
              - **Save Layout As...**: Save custom splitters and panel arrangements under custom show names.
              - **Reset to Default**: 1-tap restore to factory defaults at any time.
          files: release_assets/CueDeck-v1.1.2-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
