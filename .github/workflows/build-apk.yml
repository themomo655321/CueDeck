name: Build CueDeck Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release_assets/CueDeck-v1.0.7-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueDeck-debug-apk
          path: release_assets/CueDeck-v1.0.7-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.7
          name: "CueDeck v1.0.7 Preview APK"
          make_latest: true
          body: |
            ### 🎛️ CueDeck v1.0.7 - Live Cue Trigger & Show Control
            Direct Android APK build for mobile & tablet testing (compatible with Android 11+ and ADVAN Sketsa 2).

            #### 🛠️ What's New in v1.0.7:
            - **Horizontal Waveform Length Zoom (Time-Axis Expansion)**:
              - 1X (full track fit), 2X (200% width), and 4X (400% width) horizontal zoom with silky-smooth scrolling.
              - In/Out markers, playhead, and waveform amplitude bars stretch across the zoomed time axis for micro-precision editing.
            - **Non-Blocking Toast Pill**:
              - Moved import/save notifications to an animated floating pill centered below the top bar with auto-dismiss.
              - Completely prevents notifications from covering Settings, Master Volume, or Panic buttons.
            - **Long-Press & Drag to Rearrange Cue Stack**:
              - Touch & hold any cue to pick it up, drag it to any position in the cue stack, and drop it.
              - Sequential numbering automatically updates and persists to storage.
            - **Download Cancellation & Minimized Background Mode**:
              - Cancel slow or unwanted web audio downloads at any time with `[ Cancel ]`.
              - Tap `[ Run in Background ]` / `[ Minimize ]` to collapse the progress modal into an unobtrusive bottom indicator, allowing continued app usage during downloads.
            - **Auto-Crossfade on GO**:
              - Automatically fades out outgoing tracks when the next cue is triggered.
              - Toggleable in Settings with configurable crossfade durations (0.5s to 3.0s, default 1.5s).
            - **Multi-Show Project Manager (Save As & Load Show)**:
              - Tap the show title in the top bar to open the Show Manager.
              - Create new shows, save copies ("Save As..."), rename, delete, and switch between multiple saved shows on device.
          files: release_assets/CueDeck-v1.0.7-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
