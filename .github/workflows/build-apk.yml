name: Build CueDeck Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release_assets/CueDeck-v1.0.6-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueDeck-debug-apk
          path: release_assets/CueDeck-v1.0.6-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: "CueDeck v1.0.6 Preview APK"
          make_latest: true
          body: |
            ### 🎛️ CueDeck v1.0.6 - Live Cue Trigger & Show Control
            Direct Android APK build for mobile & tablet testing (compatible with Android 11+ and ADVAN Sketsa 2).

            #### 🛠️ What's New in v1.0.6:
            - **Bulletproof YouTube & YouTube Music Stream Resolution**:
              - Fixed HTTP 403 Forbidden error caused by YouTube IP-locking direct googlevideo audio streams.
              - Implemented dynamic instance lookup and proxied stream extraction through active Invidious endpoints (`yt.chocolatemoo53.com`).
              - Robust URL sanitizer handles `music.youtube.com`, `youtube.com/watch?v=...`, `youtu.be/...`, shorts, and embeds with query parameters (`&si=...`).
            - **YouTube Playlist Batch Import**:
              - Paste any YouTube or YouTube Music playlist link (`?list=...`) to sequentially download and queue tracks directly into the cue stack with combined progress tracking.
            - **Freesound.org & Direct Link Imports**:
              - Reliable extraction from Freesound.org sound pages and direct MP3/WAV/AAC/M4A/OGG URLs.
            - **Precise Duration & Metadata Fallbacks**:
              - Reads exact duration via Android `MediaMetadataRetriever` with upstream API fallback, ensuring accurate countdowns and waveform navigation.
          files: release_assets/CueDeck-v1.0.6-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
