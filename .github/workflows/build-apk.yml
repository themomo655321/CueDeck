name: Build CueDeck Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release_assets/CueDeck-v1.0.0-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueDeck-debug-apk
          path: release_assets/CueDeck-v1.0.0-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-preview
          name: "CueDeck v1.0.0 Preview APK"
          body: |
            ### 🎛️ CueDeck - Live Cue Trigger & Show Control
            Direct Android APK build for mobile & tablet testing (compatible with Android 11+ and ADVAN Sketsa 2).
            
            #### How to Install on your Phone/Tablet:
            1. Download `CueDeck-v1.0.0-debug.apk` below directly on your Android device.
            2. Open the downloaded file and tap **Install** (allow "Install unknown apps" if prompted).
            3. Enjoy low-latency live cue triggering!
          files: release_assets/CueDeck-v1.0.0-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
