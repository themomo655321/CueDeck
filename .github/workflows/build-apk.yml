name: Build CueDeck Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt

      - name: Push Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b build-failure-log || git checkout build-failure-log
          touch build_log.txt
          git add build_log.txt
          git commit -m "build failure log" || true
          git push -f origin build-failure-log || true

      - name: Prepare APK Asset
        run: |
            mkdir -p release_assets
            cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release_assets/CueDeck-v1.1.6-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueDeck-debug-apk
          path: release_assets/CueDeck-v1.1.6-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.6
          name: "CueDeck v1.1.6 - Auto Crossfade & Outgoing Fade Fix"
          make_latest: true
          body: |
            ### 🎛️ CueDeck v1.1.6 - Bidirectional Auto-Crossfade & Outgoing Fade Fix
            Direct Android APK build for mobile & tablet live testing.

            #### 🛠️ What's New in v1.1.6:
            - **Bidirectional Auto-Crossfade on GO**:
              - Fixed crossfade when enabled on either the outgoing playing track (e.g., background music) OR the incoming track.
              - When any new cue is triggered via GO, any playing track with Auto Crossfade enabled will now smoothly fade out over its configured fade time instead of continuing to play.
              - Synchronous active state updates in audio engines eliminate race conditions on rapid sequential triggers.
          files: release_assets/CueDeck-v1.1.6-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
