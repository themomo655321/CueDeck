name: Build CueDeck Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release_assets/CueDeck-v1.0.4-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueDeck-debug-apk
          path: release_assets/CueDeck-v1.0.4-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: "CueDeck v1.0.4 Preview APK"
          make_latest: true
          body: |
            ### 🎛️ CueDeck v1.0.4 - Live Cue Trigger & Show Control
            Direct Android APK build for mobile & tablet testing (compatible with Android 11+ and ADVAN Sketsa 2).
            
            #### 🛠️ What's New in v1.0.4:
            - **Panic Stop App-Kill Fix**:
              - Completely resolved process termination on Panic Stop. Added safe coroutine job cancellation and defensive `MediaPlayer` state checks (`isReleased`), ensuring all audio fades out and stops instantly without closing the app.
            - **Master Volume Double-Tap Reset**:
              - Double-tapping the master volume icon or the readout in the top bar instantly snaps the master volume to 100% (Unity gain).
            - **Real Audio Waveform Extraction**:
              - Analyzes real acoustic peaks from audio files (WAV fast PCM, MP3/AAC/OGG via MediaCodec) into 100 normalized amplitude bars. Cached persistently to `.peaks` files for instant 0ms loads.
            - **DJ-Style Audio Scrubbing & Cue Preview**:
              - Integrated `[ ▶ PREVIEW ]` / `[ ⏸ STOP ]` button directly in the Cue Editor to audition trimmed audio with a real-time moving playhead.
              - Real-time 40-60ms stutter/grain audio cueing when dragging the `IN` and `OUT` trim markers across the waveform.
            - **Static 4-Channel Mixer Matrix & Overflow Queue**:
              - Audio tracks stay pinned to their assigned fader slot (Channels 1-4) until playback completes.
              - Finished tracks leave their channel in `[Standby]`, without shifting other active channels down.
              - Extra tracks beyond 4 enter the overflow queue and automatically take over the next freed channel.
            - **Cue Stack Smooth Scrolling & Auto-Tracking**:
              - Fully scrollable cue list supporting deep shows with dozens of cues.
              - Auto-scrolls to keep the armed cue centered in view during sequential firing.
          files: release_assets/CueDeck-v1.0.4-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
