name: Build CueDeck Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release_assets/CueDeck-v1.0.1-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueDeck-debug-apk
          path: release_assets/CueDeck-v1.0.1-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: "CueDeck v1.0.1 Preview APK"
          make_latest: true
          body: |
            ### 🎛️ CueDeck v1.0.1 - Live Cue Trigger & Show Control
            Direct Android APK build for mobile & tablet testing (compatible with Android 11+ and ADVAN Sketsa 2).
            
            #### 🛠️ Fixes in v1.0.1:
            - **Fixed Package Parsing Error**: Corrected manifest schema and enabled v1 (JAR) + v2 signing schemes for seamless sideloading across all Android versions and OEM skins (MIUI, HyperOS, Stock Android).
            - **Consistent App Keystore**: Solved signature mismatch issues to allow direct updates without needing to uninstall older builds.
            
            #### 🚀 Features:
            - **Procreate-Style StreamLine Fader Smoothing**: Faders trail the finger with damped glide speed, eliminating hand jitter for effortless micro-fine tuning (configurable 0-90% in Settings).
            - **4-Channel Live Fader Mixer**: Real-time level sliders for active playing sounds, available in both Cue Stack and Soundboard modes.
            - **1x3 Compact Soundboard with Page Navigation**: `[ < PREV ]` and `[ NEXT > ]` paging controls to keep faders accessible.
            - **Persistent Show Auto-Save**: Show state and cue configurations persist when switching apps.
            - **Storage Bloat Protection**: Audio files are deduplicated and orphaned files are cleaned up on deletion.
            - **In-App Auto-Update**: Checks GitHub and updates CueDeck with a single tap.
          files: release_assets/CueDeck-v1.0.1-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
