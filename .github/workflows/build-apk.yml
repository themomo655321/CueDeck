name: Build CueDeck Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release_assets/CueDeck-v1.0.8-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueDeck-debug-apk
          path: release_assets/CueDeck-v1.0.8-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.8
          name: "CueDeck v1.0.8 Preview APK"
          make_latest: true
          body: |
            ### 🎛️ CueDeck v1.0.8 - Live Cue Trigger & Show Control
            Direct Android APK build for mobile & tablet testing (compatible with Android 11+ and ADVAN Sketsa 2).

            #### 🛠️ What's New in v1.0.8:
            - **Per-Cue Crossfade Out Previous Track on GO**:
              - Moved crossfade out of global settings and directly into Cue Edit modal.
              - Each cue can independently toggle "Crossfade Out Previous Track on GO" with custom fade times (`0.5s`, `1.0s`, `1.5s`, `2.0s`, `3.0s`).
              - Keeps cues that need layering/overlapping unaffected!
            - **Cue Duplication Button `[ ⧉ ]` & Removed Pause Symbol**:
              - Tap the new duplicate button on any cue row to duplicate the cue with audio file, trim points, and settings intact.
              - Removed confusing pause icon from cue stack rows.
            - **Tap Live Track Countdown to Toggle Duration View**:
              - Tap the timer on any playing track in Now Playing to toggle between countdown remaining (`-1:24`) and total duration (`2:15`).
            - **Physical Volume Keys as Cue Selector**:
              - Hardware Volume UP selects the previous cue in the stack.
              - Hardware Volume DOWN selects the next cue in the stack.
            - **Hardware Haptics Vibration Fix**:
              - Added `VIBRATE` permission and multi-API direct hardware vibrator fallback for tactile vibration feedback on GO, Panic, cue selection, and volume rocker stepping.
            - **Waveform Gliding & Zoom Horizontal Scroll Fix**:
              - Dedicated top (IN) and bottom (OUT) touch grips glide smoothly with 1:1 finger tracking.
              - Waveform canvas no longer intercepts gestures, allowing natural horizontal panning and scrolling across 1X, 2X, and 4X zoomed waveforms.
            - **Exact Numeric Timecode Typing in Cue Edit**:
              - Type exact seconds (`12.50`) or minutes:seconds (`1:15.20`) directly in IN and OUT numeric fields.
            - **Reliable Cue Reordering**:
              - Attached drag reordering directly to the dedicated `[ ≡ ]` handle, eliminating misclicks or accidental dragging when selecting unselected cues.
          files: release_assets/CueDeck-v1.0.8-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
