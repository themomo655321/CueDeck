name: Build CueDeck Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release_assets/CueDeck-v1.0.2-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueDeck-debug-apk
          path: release_assets/CueDeck-v1.0.2-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.2
          name: "CueDeck v1.0.2 Preview APK"
          make_latest: true
          body: |
            ### 🎛️ CueDeck v1.0.2 - Live Cue Trigger & Show Control
            Direct Android APK build for mobile & tablet testing (compatible with Android 11+ and ADVAN Sketsa 2).
            
            #### 🛠️ Fixes & Enhancements in v1.0.2:
            - **Fader Bi-Directional Drag Fix**: Resolved issue where pulling the fader down locked it at the bottom. Decoupled frame-smoothing loop from touch updates so the fader smoothly glides up and down without restriction.
            - **Double-Tap Reset to 100%**: Double-tapping anywhere on the fader track or cap instantly resets the channel volume to 100% (0 dB Unity gain).
            - **Quick Tap on Percentage**: Tapping the volume percentage text readout at the top also resets directly to 100%.
            - **Unity Gain Marker**: Visual feedback with a tactile indicator and green highlight at 100% volume.
            
            #### 🚀 Core Features:
            - **Procreate-Style StreamLine Fader Smoothing**: Faders trail the finger with damped glide speed, eliminating hand jitter for effortless micro-fine tuning (configurable 0-90% in Settings).
            - **4-Channel Live Fader Mixer**: Real-time level sliders for active playing sounds in both Cue Stack and Soundboard modes.
            - **1x3 Compact Soundboard with Page Navigation**: `[ < PREV ]` and `[ NEXT > ]` paging controls to keep faders accessible.
            - **Persistent Show Auto-Save**: Show state and cue configurations persist when switching apps.
            - **Storage Bloat Protection**: Audio files are deduplicated and orphaned files are cleaned up on deletion.
            - **In-App Auto-Update**: Checks GitHub and updates CueDeck with a single tap.
          files: release_assets/CueDeck-v1.0.2-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
