name: Build CueDeck Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release_assets/CueDeck-v1.0.3-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueDeck-debug-apk
          path: release_assets/CueDeck-v1.0.3-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: "CueDeck v1.0.3 Preview APK"
          make_latest: true
          body: |
            ### 🎛️ CueDeck v1.0.3 - Live Cue Trigger & Show Control
            Direct Android APK build for mobile & tablet testing (compatible with Android 11+ and ADVAN Sketsa 2).
            
            #### 🛠️ What's New in v1.0.3:
            - **Triple Fader Fine-Tuning**:
              - **[FINE] Mode Toggle**: 4x precision gear ratio for lag-free, ultra-fine adjustments.
              - **[+] and [−] Nudge Steppers**: Nudge volume by ±1% per tap or hold.
              - **Horizontal-to-Fine Scrubbing**: Pulling sideways dynamically slows down fader speed with a `FINE 4X` indicator badge.
              - Retained double-tap reset to 100% and quick MUTE toggle.
            - **Project Audio Storage & Bloat Inspector**:
              - Audio stored in device-accessible external storage (`/Android/data/com.cuedeck.app/files/shows/`).
              - In-app storage manager showing path, total MB consumed, file roster with active/unused tags, "Open in System Files", and 1-tap "Purge Unused Audio".
            - **Hardware Volume Buttons as Stage Remote**:
              - Optional Settings toggle: Volume UP = GO, Volume DOWN = Panic Stop. Suppresses phone volume popups.
            - **Interactive Waveform Display**:
              - Waveform peak visualization in Cue Editor with draggable green `IN` and red `OUT` handles for non-destructive trimming.
            - **Drive / Cloud Import Progress Bar**:
              - Asynchronous streaming from Google Drive / storage with progress bar (`0%` → `100%`).
            - **Focus-Loss Auto-Save & Session Recovery**:
              - Automatically persists show and live session state (`session_state.json`) on `onPause()`/`onStop()`. Returning to the app restores all cues, active tab, and fader levels.
            - **Diagnostics & Error Log Grabber**:
              - In-app error console with a 1-tap **"Copy Error Log to Clipboard"** button.
            - **Live Performance Enhancements**:
              - **Keep Screen Awake** toggle (prevents sleep during shows).
              - **Haptic Vibration** on GO, Panic, and pad triggers.
              - **Zero-Latency Pre-Buffering** for the armed cue.
          files: release_assets/CueDeck-v1.0.3-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
