name: Build CueDeck Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          set -o pipefail
          ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace 2>&1 | tee build_log.txt

      - name: Push Build Log on Failure
        if: failure()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git checkout -b build-failure-log || git checkout build-failure-log
          git add build_log.txt
          git commit -m "build failure log"
          git push -f origin build-failure-log

      - name: Prepare APK Asset
        run: |
            mkdir -p release_assets
            cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release_assets/CueDeck-v1.1.3-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueDeck-debug-apk
          path: release_assets/CueDeck-v1.1.3-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.3
          name: "CueDeck v1.1.3 Preview APK"
          make_latest: true
          body: |
            ### 🎛️ CueDeck v1.1.3 - Stage Layout & Audio Response Overhaul
            Direct Android APK build for mobile & tablet live testing.

            #### 🛠️ What's New in v1.1.3:
            - **Zero-Latency Audio Faders**:
              - Eliminated the 25ms smoothing coroutine cancellation choke on physical dragging — manual fader movements now write directly to audio hardware with **0ms instant response**.
              - Decoupled touch gesture tracking from StateFlow re-emission, delivering buttery-smooth 60/120Hz fader movement with no visual or audio stutter.
            - **Ultra-Compact Armed / Standby Stage Ribbon (~38dp)**:
              - Replaced the bulky 115dp card with a sleek 1-row broadcast strip displaying `[STANDBY]`, bold Cue number, track name, duration, follow action, and stage edit button. Saves over 75dp of vertical space!
            - **Compact "Now Playing" Drawer (Max 68dp)**:
              - Re-engineered active playback rows into ultra-slim 26dp single lines with embedded micro progress bars and audio kill/fade buttons. Capped at 68dp max in landscape so it never squashes the screen.
            - **Guaranteed Cue Stack Space**:
              - Enforced `heightIn(min = 140.dp)` on the Cue Stack across all landscape and portrait layouts — the cue stack is **guaranteed to always show at least 3–4 full cue rows** regardless of how many cues are currently playing.
            - **Fluid Draggable Splitter**:
              - Fixed the delta accumulation bug so dragging between 20% and 80% screen width is immediate and continuous.
              - Expanded touch hit area to 32dp for effortless thumb dragging on mobile screens.
            - **Cleaned Up Unused Legacy Code**:
              - Removed obsolete 257-line `CartGridSection` and legacy soundboard pad slots.
              - Consolidated landscape console layouts into DRY, reusable components.
              - Removed the unused high-contrast stage theme toggle from Settings.
          files: release_assets/CueDeck-v1.1.3-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
