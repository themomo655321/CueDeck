name: Build CueDeck Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release_assets/CueDeck-v1.0.5-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueDeck-debug-apk
          path: release_assets/CueDeck-v1.0.5-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.5
          name: "CueDeck v1.0.5 Preview APK"
          make_latest: true
          body: |
            ### 🎛️ CueDeck v1.0.5 - Live Cue Trigger & Show Control
            Direct Android APK build for mobile & tablet testing (compatible with Android 11+ and ADVAN Sketsa 2).
            
            #### 🛠️ What's New in v1.0.5:
            - **Portrait Split-Screen Layout**:
              - Left side: Armed Standby card + Now Playing active cues drawer.
              - Right side: Full-height, unconstrained Cue Stack with smooth scrolling and plenty of vertical breathing room.
              - Bottom: 4-Channel Live Mixer + Persistent Full-Width Green GO button!
            - **Landscape Dual-Pane Layout**:
              - Left pane: Now Playing active countdowns + 4 Fader Channel Strips.
              - Right pane: Armed Standby Card + Cue Stack + Giant GO thumb trigger on the right edge.
            - **Silky Smooth In-Out Waveform Trimming**:
              - Removed 100ms discrete quantization: markers glide at 60fps with float precision matching the faders.
              - Added 1X, 2X, 4X horizontal zoom multipliers for surgical precision trimming.
            - **Universal Web Audio Importer (YouTube, Freesound.org & Direct Links)**:
              - Import audio directly into the cue stack from YouTube, YouTube Music, Freesound.org, or any direct MP3/WAV/AAC URL with live streaming progress!
              - Works 100% offline once downloaded.
            - **Auto-Gain Normalization**:
              - One-tap "⚖ NORMALIZE GAIN" button in Cue Editor automatically levels quiet and loud tracks to standard theatrical volume (-14 LUFS / 95% peak).
            - **Cue Stack Reordering**:
              - One-tap ▲ and ▼ buttons on each cue item to quickly change firing order.
            - **Streamlined Theater UI**:
              - Removed soundboard matrix tab to focus 100% on sequential theatrical cue control.
            - **Night-Vision Stage Booth Theme**:
              - Toggle high-contrast red & black theme in Settings for dark backstage booths.
          files: release_assets/CueDeck-v1.0.5-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
