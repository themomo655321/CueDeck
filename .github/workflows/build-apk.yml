name: Build CueDeck Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.8

      - name: Generate Gradle Wrapper
        run: gradle wrapper --gradle-version 8.8

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Android Debug APK
        run: ./gradlew :androidApp:assembleDebug --no-daemon --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release_assets
          cp androidApp/build/outputs/apk/debug/androidApp-debug.apk release_assets/CueDeck-v1.0.9-debug.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CueDeck-debug-apk
          path: release_assets/CueDeck-v1.0.9-debug.apk
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: "CueDeck v1.0.9 Preview APK"
          make_latest: true
          body: |
            ### 🎛️ CueDeck v1.0.9 - Live Cue Trigger & Show Control
            Direct Android APK build for mobile & tablet testing (compatible with Android 11+ and ADVAN Sketsa 2).

            #### 🛠️ What's New in v1.0.9:
            - **Click Standby / Armed Card to Open Cue Edit**:
              - Tap anywhere on the Armed / Standby card on the top left to instantly open the selected cue's settings modal.
            - **Volume Rocker Wrap Around**:
              - Volume UP from the top of the cue stack wraps directly to the last cue at the bottom.
              - Volume DOWN from the bottom wraps directly to the top cue.
            - **Dynamic Fader Gear Ratio (Side-Pull Sensitivity)**:
              - When holding and pulling a vertical fader, dead center gives standard 1:1 fader response.
              - Dragging your finger to the side adjusts the gear ratio: the further away from center, the faster the fader sweeps (up to 4.5X speed) with a floating `FAST %.1fX` visual indicator.
            - **Reverb / Echo Fade-Out Tail**:
              - Added a compact `[✦ TAIL]` toggle button on each of the 4 mixer faders.
              - When active, reverb wetness automatically increases as volume drops near 3% down to 0%, leaving a lush 1.8-second decay tail instead of an abrupt hard cut for smooth stage transitions.
          files: release_assets/CueDeck-v1.0.9-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
