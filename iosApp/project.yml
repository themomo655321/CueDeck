name: iosApp
options:
  bundleIdPrefix: com.cuedeck
  deploymentTarget:
    iOS: "16.0"
targets:
  iosApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iosApp
    settings:
      base:
        PRODUCT_NAME: CueDeck
        PRODUCT_BUNDLE_IDENTIFIER: com.cuedeck.ios
        CURRENT_PROJECT_VERSION: 15
        MARKETING_VERSION: "1.1.4"
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: iosApp/Info.plist
        FRAMEWORK_SEARCH_PATHS:
          - $(inherited)
          - $(SRCROOT)/../shared/build/bin/iosArm64/releaseFramework
        ENABLE_USER_SCRIPT_SANDBOXING: false
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: false
        CODE_SIGNING_REQUIRED: false
    dependencies:
      - framework: ../shared/build/bin/iosArm64/releaseFramework/shared.framework
        embed: true
